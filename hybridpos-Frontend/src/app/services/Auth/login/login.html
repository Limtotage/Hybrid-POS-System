<div class="login-container">

  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <input
      type="text"
      placeholder="Username"
      [(ngModel)]="loginForm.username"
      name="username"
      required
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="loginForm.password"
      name="password"
      required
    />

    <button type="submit">
      Giriş Yap
    </button>

  </form>

</div>
