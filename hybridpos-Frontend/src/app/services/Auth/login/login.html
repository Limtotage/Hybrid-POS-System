<div class="login-page">
  <div class="login-container">
    <div class="login-left">
      <div class="login-content">
        <h1 class="sign-in-text">
          Sign In
        </h1>
        <p class="login-description">
          Access the HybridPOS panel using your username and password.
        </p>
        <form
          (ngSubmit)="login()"
          #loginFormElement="ngForm"
        >
          <div class="form-group">
            <label for="username">
              Username <span>*</span>
            </label>
            <div class="input-wrapper">
              <input
                id="username"
                type="text"
                placeholder="Username"
                [(ngModel)]="loginForm.username"
                name="username"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label for="password">
              Password <span>*</span>
            </label>
            <div class="input-wrapper">
              <input
                id="password"
                type="password"
                placeholder="Password"
                [(ngModel)]="loginForm.password"
                name="password"
                required
              />
            </div>
          </div>
          <button
            class="login-button"
            type="submit"
            [disabled]="!loginFormElement.valid"
          >
            Sign In
          </button>
        </form>
      </div>
      <div class="copyright">
        Design Copyrights Figma - DreamsPOS
      </div>
    </div>
    <div class="login-right">

      <img
        class="login-illustration"
        src="/images/png-for-login.png"
        alt="Login illustration"
      />
    </div>
  </div>
</div>
