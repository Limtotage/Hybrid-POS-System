<div class="cashiers-page">

  <div class="page-header">

    <div>
      <h1>Cashiers</h1>

      <p>
        Manage your shop cashiers.
      </p>
    </div>

  </div>


  <div class="cashier-card">

    <div class="card-title">

      <div class="title-icon">
        +
      </div>

      <div>
        <h2>Add Cashier</h2>
        <p>Create a new cashier account.</p>
      </div>

    </div>


    <form
      #cashierForm="ngForm"
      (ngSubmit)="createCashier(cashierForm)"
    >

      <div class="form-group">

        <label>
          Username
        </label>

        <input
          type="text"
          placeholder="Enter username"
          [(ngModel)]="cashier.username"
          name="username"
          required
        />

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          placeholder="Enter password"
          [(ngModel)]="cashier.password"
          name="password"
          required
        />

      </div>


      <div class="form-actions">

        <button
          type="submit"
          [disabled]="!cashierForm.valid"
        >
          Add Cashier
        </button>

      </div>

    </form>

  </div>

</div>
