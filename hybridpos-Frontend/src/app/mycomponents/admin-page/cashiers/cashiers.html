<div class="cashier-register-container">

  <h2>Kasiyer Ekle</h2>

  <form
    #cashierForm="ngForm"
    (ngSubmit)="createCashier(cashierForm)"
  >

    <input
      type="text"
      placeholder="Kullanıcı adı"
      [(ngModel)]="cashier.username"
      name="username"
      required
    />

    <input
      type="password"
      placeholder="Şifre"
      [(ngModel)]="cashier.password"
      name="password"
      required
    />

    <button type="submit">
      Kasiyer Ekle
    </button>

  </form>

</div>
