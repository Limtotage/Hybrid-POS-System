<div class="Product-Adding-Container">
  <h2>Create Product</h2>

  <form #ProductForm="ngForm" (ngSubmit)="addProduct(ProductForm)">
    <div class="form-group">
      <label for="barcode"> Barcode </label>

      <input
        id="barcode"
        type="text"
        placeholder="Barkod"
        [(ngModel)]="newProduct.barcode"
        name="barcode"
        required
      />
    </div>

    <div class="form-group">
      <label for="name"> Product Name </label>

      <input
        id="name"
        type="text"
        placeholder="Ürün adı"
        [(ngModel)]="newProduct.name"
        name="name"
        required
      />
    </div>

    <div class="form-group">
      <label for="purchasePrice"> Purchase Price </label>

      <input
        id="purchasePrice"
        type="number"
        [(ngModel)]="newProduct.purchasePrice"
        name="purchasePrice"
        required
      />
    </div>

    <div class="form-group">
      <label for="salePrice"> Sale Price </label>

      <input
        id="salePrice"
        type="number"
        [(ngModel)]="newProduct.salePrice"
        name="salePrice"
        required
      />
    </div>

    <div class="form-group">
      <label for="stockQuantity"> Stock Quantity </label>

      <input
        id="stockQuantity"
        type="number"
        [(ngModel)]="newProduct.stockQuantity"
        name="stockQuantity"
        required
      />
      <label for="stockQuantity"> Product Image </label>
      <input type="file" accept="image/*" (change)="onImageSelected($event)" />
    </div>

    <button type="submit">Add Product</button>
  </form>
</div>
