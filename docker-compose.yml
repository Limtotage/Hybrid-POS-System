services:

  postgres:
    image: postgres:16
    container_name: hybridpos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shopAdmin
      POSTGRES_PASSWORD: shopAdmin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hybridpos-network


  redis:
    image: redis:7
    container_name: hybridpos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hybridpos-network
  config-server:
    image: hybridpos-config-server:latest
    container_name: hybridpos-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: file:///home/limtotage/Desktop/Hybrid-POS-System/config-repo
    volumes:
      - ./config-repo:/home/limtotage/Desktop/Hybrid-POS-System/config-repo
    networks:
      - hybridpos-network
  eureka-server:
    image: hybridpos-eureka-server:latest
    container_name: hybridpos-eureka-server
    ports:
      - "8761:8761"
    networks:
      - hybridpos-network
  auth-service:
    image: hybridpos-auth-service:latest
    container_name: hybridpos-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - hybridpos-network
  product-service:
    image: hybridpos-product-service:latest
    container_name: hybridpos-product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - hybridpos-network
  sale-service:
    image: hybridpos-sale-service:latest
    container_name: hybridpos-sale-service
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sale_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - hybridpos-network
  cash-service:
    image: hybridpos-cash-service:latest
    container_name: hybridpos-cash-service
    ports:
      - "8084:8084"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cash_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - hybridpos-network
  report-service:
    image: hybridpos-report-service:latest
    container_name: hybridpos-report-service
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/report_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - hybridpos-network
  api-gateway:
    image: hybridpos-api-gateway:latest
    container_name: hybridpos-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - hybridpos-network

  kafka:
    image: apache/kafka:4.1.0
    container_name: hybridpos-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - hybridpos-network

networks:
  hybridpos-network:
    name: hybridpos-network
    external: true
volumes:
  postgres_data:
    name: hybridpos_postgres_data
    external: true

  redis_data:
    name: 6feba73a0fc11a3aaaaf06cc0b06ec1922616730037c2a6ee85fbbd6124a3490
    external: true

